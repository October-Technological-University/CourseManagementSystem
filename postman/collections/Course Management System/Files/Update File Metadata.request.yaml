$kind: http-request
name: Update File Metadata
method: PUT
url: '{{baseUrl}}/api/files/:fileId'
order: 7000
pathVariables:
  - key: fileId
    value: '{{fileId}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "title": "Updated Lecture Notes",
      "description": "Updated description for the file"
    }
