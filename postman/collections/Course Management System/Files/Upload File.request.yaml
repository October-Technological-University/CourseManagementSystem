$kind: http-request
name: Upload Course File
method: POST
url: '{{baseUrl}}/api/files/upload/course'
order: 4000
body:
  type: formdata
  content:
    - key: file
      type: file
      src: ''
      description: 'The file to upload'
    - key: course_id
      type: text
      value: '{{courseId}}'
      description: 'ID of the course'
    - key: subtype
      type: text
      value: assignment
      description: 'assignment or resource'
