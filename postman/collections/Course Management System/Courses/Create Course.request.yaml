$kind: http-request
name: Create Course
method: POST
url: '{{baseUrl}}/api/courses'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "title": "Introduction to Programming",
      "description": "A beginner-friendly course on programming fundamentals.",
      "instructor_id": "{{instructorId}}",
      "category": "Computer Science",
      "status": "active"
    }
