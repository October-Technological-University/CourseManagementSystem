$kind: http-request
name: Update Enrollment Status
method: PUT
url: '{{baseUrl}}/api/enrollments/:enrollmentId'
order: 7000
pathVariables:
  - key: enrollmentId
    value: '{{enrollmentId}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "status": "active"
    }
