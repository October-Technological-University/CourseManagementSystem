$kind: http-request
name: Change Password
method: POST
url: '{{baseUrl}}/api/auth/change-password'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "current_password": "password123",
      "new_password": "newpassword456",
      "new_password_confirmation": "newpassword456"
    }
